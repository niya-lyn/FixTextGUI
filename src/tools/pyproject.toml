[project]
name = "fix-text-tools"
version = "0.1.0"
description = "fix-text-tools"
requires-python = ">=3.8"

dependencies = [
    "ansi2html",
    "PyQt5",
    "PyQt5-Qt5",
    "PyQt5-sip",
    "regex",
    "py-emmet",
    "Markdown",
    "importlib-metadata; python_version<'3.10'",
    "chardet",
    "pypinyin",
    "portalocker",
    "qtpy>=2.4.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
