name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: lint + gates + tests + baseline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 一键 CI（lint + format-check + gates + tests + baseline）
        # baseline 环节在缺 php/go 的矩阵位（如 Windows）自动 SKIP，不算失败
        run: python scripts/ci.py

      - name: 空壳应用启动冒烟（独立进程，offscreen）
        run: python scripts/smoke_launch.py --timeout 60

  baseline:
    # T0.4 回归基线专用位：ubuntu 自带 php 与 go，强制执行（不接受 SKIP）
    name: 回归基线重跑比对（T0.4）
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 一键重跑比对（Go + PHP 双后端 × 15 语料 vs 冻结基线）
        run: python scripts/ci_baseline.py --keep-json

      - name: 上传比对结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-check-result
          path: baseline/results/ci_baseline_check.json
          if-no-files-found: ignore
